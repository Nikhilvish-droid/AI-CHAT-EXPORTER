# Serves the built frontend and proxies /api/* to uvicorn on the same host,
# so the browser only ever talks to one origin (no CORS, no hard-coded URLs).
# Installed by deploy/setup-server.sh to /etc/nginx/sites-available/.

# Endpoints have no auth; this stops one client from draining the Groq quota.
# One conversion = 4 API calls, so this allows ~5 conversions a minute per IP.
limit_req_zone $binary_remote_addr zone=chat_exporter_api:10m rate=20r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/chat-exporter;
    index index.html;

    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed file names here, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        limit_req zone=chat_exporter_api burst=20 nodelay;
        limit_req_status 429;

        # No trailing slash: the /api prefix is passed through to FastAPI.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # /api/scrape (headless Chromium) and /api/write (LLM, with retries)
        # can take minutes on a small instance.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
